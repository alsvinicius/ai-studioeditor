services:
  post-production:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      APP_DATA_DIR: /data
      MODEL_CACHE_DIR: /models
      ARGOS_PACKAGES_DIR: /models/argos/packages
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      OPENCODE_AUTH_FILE: /root/.local/share/opencode/auth.json
      CODEX_AUTH_FILE: /root/.codex/auth.json
      YOUTUBE_CLIENT_SECRETS: ${YOUTUBE_CLIENT_SECRETS:-/run/secrets/client_secret.json}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-http://127.0.0.1:${WEB_PORT:-8000}/api/youtube/callback}
    volumes:
      - ./data:/data
      - ./models:/models
      - ./secrets:/run/secrets:ro
      - ${OPENCODE_AUTH_FILE:-${HOME}/.local/share/opencode/auth.json}:/root/.local/share/opencode/auth.json:ro
      - ${CODEX_AUTH_FILE:-${HOME}/.codex/auth.json}:/root/.codex/auth.json:ro
    restart: unless-stopped
